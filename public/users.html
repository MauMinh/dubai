<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Thành Viên | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Inter', sans-serif; }
        .main-card { border-radius: 20px; border: none; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .table thead th { 
            background-color: #1a1d20; color: #fff; 
            padding: 20px; border: none; font-weight: 600;
        }
        .table tbody td { padding: 20px; vertical-align: middle; border-bottom: 1px solid #f1f1f1; }
        .role-badge { 
            padding: 6px 12px; border-radius: 20px; 
            font-size: 0.7rem; font-weight: 800; letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <h2 class="fw-bold text-dark mb-0"><i class="fas fa-users-gear me-3 text-primary"></i>QUẢN LÝ THÀNH VIÊN</h2>
                <p class="text-muted small">Danh sách toàn bộ nhân sự trong CLB</p>
            </div>
            <a href="index.html" class="btn btn-outline-dark px-4 rounded-pill fw-bold">
                <i class="fas fa-arrow-left me-2"></i>Trang chủ
            </a>
        </div>
        
        <div class="card main-card overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th class="ps-4">ID</th>
                            <th>Thông tin thành viên</th>
                            <th>Tài khoản</th>
                            <th class="text-center">Quyền hạn</th>
                        </tr>
                    </thead>
                    <tbody id="userList">
                        <!-- JS Load -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadUsers() {
            try {
                const res = await fetch('index.php/user/list');
                const result = await res.json();
                if (result.status === "success") {
                    document.getElementById('userList').innerHTML = result.data.map(u => `
                        <tr>
                            <td class="ps-4 text-muted fw-bold">#${u.id}</td>
                            <td>
                                <div class="fw-bold text-dark">${u.full_name}</div>
                                <div class="small text-muted"><i class="far fa-circle-check me-1 text-success"></i>Thành viên chính thức</div>
                            </td>
                            <td><span class="badge bg-light text-primary border px-3">@${u.username}</span></td>
                            <td class="text-center">
                                <span class="role-badge ${u.role === 'admin' ? 'bg-danger text-white' : 'bg-primary text-white'} text-uppercase">
                                    ${u.role}
                                </span>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (e) { console.error(e); }
        }
        loadUsers();
    </script>
</body>
</html>
